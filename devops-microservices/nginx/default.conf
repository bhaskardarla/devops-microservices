server {
    listen 80;
    server_name _;

    location /users/ {
        proxy_pass http://user-service:3000/;
    }

    location /products/ {
        proxy_pass http://product-service:3000/;
    }

    location /orders/ {
        proxy_pass http://order-service:3000/;
    }

    location / {
        default_type text/plain;
        return 200 "Microservices API gateway is running. Try /users/, /products/, or /orders/\n";
    }
}
